name: ferrecerca_app
description: "TiendaCerca — encuentra tiendas cercanas de cualquier rubro y sus ofertas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestión de estado simple (ChangeNotifier + Provider)
  provider: ^6.1.2

  # Geolocalización real del dispositivo
  geolocator: ^13.0.2

  # Mapa con OpenStreetMap (no requiere API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Tipografía (Space Grotesk, para igualar el prototipo)
  google_fonts: ^6.2.1

  # Abrir "Llamar" y "Cómo llegar" en apps externas
  url_launcher: ^6.3.1

  # Base de datos local (SQLite) — favoritos y ofertas del comerciante
  sqflite: ^2.4.1
  path: ^1.9.0

  # Foto real de la oferta al publicarla (cámara o galería)
  image_picker: ^1.1.2

  # Hash de contraseñas para el login real (semana 8)
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Permite que las pruebas (flutter test) usen SQLite de verdad sin un
  # emulador/celular — ver test/role_navigation_test.dart.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
